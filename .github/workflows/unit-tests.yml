name: Run unit tests, lint code, and build documentation

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Unit tests
    continue-on-error: false
    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-2025"
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install LLVM and Clang on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          mkdir /c/llvm_new
          curl -L -C - --retry 5 --retry-all-errors -o /c/llvm_new/llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.6/clang+llvm-23.1.6-x86_64-pc-windows-msvc.tar.xz"
          7z x /c/llvm_new/llvm.tar.xz -o/c/llvm_new
          rm /c/llvm_new/llvm.tar.xz
          7z x /c/llvm_new/llvm.tar -o/c/llvm_new
          rm /c/llvm_new/llvm.tar
          echo "/c/llvm_new/clang+llvm-23.1.6-x86_64-pc-windows-msvc/bin" >> "$GITHUB_PATH"
          which clang
          clang --version
      - name: Install pkg-config on Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          choco install pkgconfiglite
      - name: Install Poetry
        shell: bash
        # /usr/local/bin doesn't exist on a Windows runner
        # /usr/bin is not writable on a Linux runner
        run: |
          export BIN_DIR=$([ "$RUNNER_OS" = "Windows" ] && echo "Scripts" || echo "bin")
          export SYMLINK_DIR=$([ "$RUNNER_OS" = "Windows" ] && echo "/usr/bin" || echo "/usr/local/bin")
          export POETRY_HOME=`mktemp -d`
          python -m venv $POETRY_HOME --upgrade-deps
          $POETRY_HOME/$BIN_DIR/pip install poetry
          ln $POETRY_HOME/$BIN_DIR/poetry $SYMLINK_DIR/poetry
          which poetry
          poetry --version
          poetry config virtualenvs.in-project true
      - name: Install Python dependencies and build package
        shell: bash
        run: |
          which clang
          clang --version
          poetry install --extras=dev
          poetry run spin setup-in-place
          poetry run spin in-place
      - name: Test with pytest
        shell: bash
        run: |
          poetry run python -m pytest --doctest-modules cython_blas

  lint:
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Poetry
        shell: bash
        # /usr/local/bin doesn't exist on a Windows runner
        # /usr/bin is not writable on a Linux runner
        run: |
          export BIN_DIR=$([ "$RUNNER_OS" = "Windows" ] && echo "Scripts" || echo "bin")
          export SYMLINK_DIR=$([ "$RUNNER_OS" = "Windows" ] && echo "/usr/bin" || echo "/usr/local/bin")
          export POETRY_HOME=`mktemp -d`
          python -m venv $POETRY_HOME --upgrade-deps
          $POETRY_HOME/$BIN_DIR/pip install poetry
          ln $POETRY_HOME/$BIN_DIR/poetry $SYMLINK_DIR/poetry
          which poetry
          poetry --version
          poetry config virtualenvs.in-project true
      - name: Install Python dependencies
        run: |
          poetry install --extras=lint
      - name: Ruff check auto-fixable
        run: |
          poetry run ruff check --config=pyproject.toml --diff --unsafe-fixes .
      - name: Ruff check not auto-fixable
        run: |
          poetry run ruff check --config=pyproject.toml .
      - name: Ruff format
        run: |
          poetry run ruff format --config=pyproject.toml --diff .
      - name: Deptry
        run: |
          poetry run deptry .
      - name: cython-lint
        run: |
          poetry run cython-lint .
      - name: isort Cython
        run: |
          poetry run isort --diff .
          poetry run isort -c .

  docs:
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Poetry
        shell: bash
        # /usr/local/bin doesn't exist on a Windows runner
        # /usr/bin is not writable on a Linux runner
        run: |
          export BIN_DIR=$([ "$RUNNER_OS" = "Windows" ] && echo "Scripts" || echo "bin")
          export SYMLINK_DIR=$([ "$RUNNER_OS" = "Windows" ] && echo "/usr/bin" || echo "/usr/local/bin")
          export POETRY_HOME=`mktemp -d`
          python -m venv $POETRY_HOME --upgrade-deps
          $POETRY_HOME/$BIN_DIR/pip install poetry
          ln $POETRY_HOME/$BIN_DIR/poetry $SYMLINK_DIR/poetry
          which poetry
          poetry --version
          poetry config virtualenvs.in-project true
      - name: Install Python dependencies and build package
        run: |
          poetry install --extras=dev
          poetry run spin setup-in-place
          poetry run spin in-place
      - name: Build documentation
        run: |
          poetry run spin docs
