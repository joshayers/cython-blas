name: Build wheels and sdist

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  build_wheels:
    name: "Build wheels: ${{ matrix.os }}"
    continue-on-error: true
    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-2025"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install LLVM and Clang on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          mkdir /c/llvm_new
          curl -L -C - --retry 5 --retry-all-errors -o /c/llvm_new/llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.6/clang+llvm-23.1.6-x86_64-pc-windows-msvc.tar.xz"
          7z x /c/llvm_new/llvm.tar.xz -o/c/llvm_new
          rm /c/llvm_new/llvm.tar.xz
          7z x /c/llvm_new/llvm.tar -o/c/llvm_new
          rm /c/llvm_new/llvm.tar
          find /c/llvm_new/clang+llvm-23.1.6-x86_64-pc-windows-msvc/bin/*.exe -maxdepth 1 -type f -exec ln -s {} /usr/bin \;
          which clang
          clang --version
      - name: Install pkg-config on Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          choco install pkgconfiglite
      - name: Build wheels
        shell: bash
        run: |
          export BIN_DIR=$([ "$RUNNER_OS" = "Windows" ] && echo "Scripts" || echo "bin")
          export VENV_HOME=`mktemp -d`
          python -m venv $VENV_HOME --upgrade-deps
          export PATH=$VENV_HOME/$BIN_DIR:$PATH
          pip install cibuildwheel
          echo `which cibuildwheel`
          cibuildwheel
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Build source dist and upload all
    runs-on: "ubuntu-latest"
    needs: [build_wheels]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Poetry
        shell: bash
        # /usr/local/bin doesn't exist on a Windows runner
        # /usr/bin is not writable on a Linux runner
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then export BIN_DIR="Scripts"; else export BIN_DIR="bin"; fi
          if [ "$RUNNER_OS" = "Windows" ]; then export SYMLINK_DIR="/usr/bin"; else export SYMLINK_DIR="/usr/local/bin"; fi
          export POETRY_HOME=`mktemp -d`
          python -m venv $POETRY_HOME --upgrade-deps
          $POETRY_HOME/$BIN_DIR/pip install poetry
          ln $POETRY_HOME/$BIN_DIR/poetry $SYMLINK_DIR/poetry
          poetry --version
          poetry config virtualenvs.in-project true
      - name: Install Python dependencies
        shell: bash
        run: |
          poetry install --extras=dev
      - name: Build sdist
        run: |
          poetry run spin build
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-wheels-*
          merge-multiple: true
          path: dist/
      - name: Upload wheels and sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-and-sdist
          path: dist/
