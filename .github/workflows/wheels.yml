name: Build wheels and sdist

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  build_wheels:
    name: "Build wheels: ${{ matrix.os }}"
    continue-on-error: true
    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-2025"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install LLVM and Clang on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: cmd
        run: |
          powershell "(New-Object Net.WebClient).DownloadFile('https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.6/clang+llvm-23.1.6-x86_64-pc-windows-msvc.tar.xz', 'c:\test\llvm.tar.xz')"
          7z x "C:\llvm_new\llvm.tar.xz" -o"c:\llvm_new"
          del "c:\llvm_new\llvm.tar.xz"
          7z x "C:\llvm_new\llvm.tar" -o"c:\llvm_new"
          del "c:\llvm_new\llvm.tar"
          powershell "[Environment]::SetEnvironmentVariable('Path', 'C:\llvm_new\clang+llvm-23.1.6-x86_64-pc-windows-msvc\bin;' + $env:Path, 'User')"
      - name: Install pkg-config on Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          choco install pkgconfiglite
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Build source dist and upload all
    runs-on: "ubuntu-latest"
    needs: [build_wheels]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Poetry, not Windows
        shell: bash
        run: |
          export POETRY_HOME=`mktemp -d`
          python -m venv $POETRY_HOME --upgrade-deps
          $POETRY_HOME/bin/pip install -q poetry
          ln $POETRY_HOME/bin/poetry /usr/local/bin/poetry
          poetry --version
          poetry config virtualenvs.in-project true
      - name: Install Python dependencies
        shell: bash
        run: |
          poetry install --extras=dev
      - name: Build sdist
        run: |
          poetry run spin build
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-wheels-*
          merge-multiple: true
          path: dist/
      - name: Upload wheels and sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-and-sdist
          path: dist/
